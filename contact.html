<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Apex Triad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .contact-wrap{
    max-width: 460px;
    margin: 0 auto;
    padding: 0 1.5rem 4.5rem;
  }

  .contact-form{
    display: flex;
    flex-direction: column;
    gap: 1.3rem;
  }

  .field label{
    display: block;
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-bottom: 0.4rem;
  }

  .field input,
  .field textarea{
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 1rem;
    padding: 0.6rem 0.1rem;
    outline: none;
    transition: border-color 0.3s;
    resize: vertical;
  }

  .field input:focus,
  .field textarea:focus{ border-color: var(--blood-bright); }

  .contact-form button{
    align-self: flex-start;
    background: var(--blood);
    color: var(--ink);
    border: none;
    font-family: 'Bevan', serif;
    letter-spacing: 0.03em;
    padding: 0.75rem 1.6rem;
    cursor: pointer;
    transition: background 0.25s;
  }

  .contact-form button:hover{ background: var(--blood-bright); }

  .direct-line{
    text-align: center;
    margin-top: 3rem;
    padding-top: 2.5rem;
    border-top: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 0.92rem;
  }

  .direct-line a{
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--blood-bright);
  }
</style>
</head>
<body>

  <nav>
    <a class="brand-mark" href="home.html">APEX <span>TRIAD</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">Menu</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="home.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="story.html">Story</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="page-header">
      <h1 class="display">Get in touch</h1>
      <p>Questions about an order, sizing, or just want to say something — send it over.</p>
    </div>

    <div class="contact-wrap">
      <form class="contact-form" id="contactForm">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" rows="4" required></textarea>
        </div>
        <button type="submit">Send</button>
      </form>

      <div class="direct-line">
        Prefer email directly? Write to <a href="mailto:apextriadfit@gmail.com">apextriadfit@gmail.com</a>
      </div>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Apex Triad. All rights reserved.
    <div class="foot-links">
      <a href="mailto:apextriadfit@gmail.com">Email</a>
      <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
      <a href="https://youtube.com" target="_blank" rel="noopener">YouTube</a>
      <a href="https://tiktok.com" target="_blank" rel="noopener">TikTok</a>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => links.classList.toggle('open'));

    document.getElementById('contactForm').addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;
      const subject = encodeURIComponent('Message from ' + name);
      const body = encodeURIComponent(message + '\n\nReply to: ' + email);
      window.location.href = 'mailto:apextriadfit@gmail.com?subject=' + subject + '&body=' + body;
    });
  </script>

</body>
</html>
